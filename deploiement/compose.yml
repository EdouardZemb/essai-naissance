# Lancé par `dc` (lib.sh), ou à la main avec les mêmes arguments : le projet, les deux fichiers et
# le compose.env que le déploiement écrit :
#   docker compose -p <projet> -f <clone>/deploiement/compose.yml \
#     -f <clone>/deploiement/compose.projet.yml --env-file <état>/compose.env …
# Quand compose.env porte ESSAI_NAISSANCE_CONFIG ou ESSAI_NAISSANCE_CONTENU, `dc` ajoute après eux
# -f <clone>/deploiement/compose.config.yml ou -f <clone>/deploiement/compose.contenu.yml : les
# montages de l'instantané des données (M-0006, § 5).
# <état> vaut ~/.local/state/essai-naissance/<env>, sauf si ESSAI_NAISSANCE_RACINE_ETAT le déplace.
# Pas de `name:` ici : le projet (`essai-naissance`, `essai-naissance-staging`, `essai-naissance-local`…) vient de `-p`.
# Les variables `${…:?}` sans valeur font échouer la commande : mieux vaut un arrêt net qu'un
# conteneur lancé avec la mauvaise image ou les mauvais dossiers.
# Les ajouts propres au projet (volumes, variables, mem_limit) vont dans `compose.projet.yml`.
services:
  app:
    image: ${ESSAI_NAISSANCE_IMAGE:?}
    environment:
      ESSAI_NAISSANCE_ENV: ${ESSAI_NAISSANCE_ENV:?}
      ESSAI_NAISSANCE_VERSION: ${ESSAI_NAISSANCE_VERSION:?}
      ESSAI_NAISSANCE_URL_PUBLIQUE: ${ESSAI_NAISSANCE_URL_PUBLIQUE:?}
    volumes:
      - ${ESSAI_NAISSANCE_DONNEES:?}:/donnees
      - ${ESSAI_NAISSANCE_SAUVEGARDES:?}:/sauvegardes
    # Publié sur la boucle locale seulement : l'accès public passe par le tunnel.
    ports:
      - "127.0.0.1:${ESSAI_NAISSANCE_PORT:?}:3000"
    # Le réseau du tunnel est créé par le serveur, un par projet et par environnement : le tunnel
    # commun joint l'application par cet alias, sans port publié.
    networks:
      default: {}
      tunnel:
        aliases:
          - essai-naissance-${ESSAI_NAISSANCE_ENV}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  tunnel:
    external: true
    name: tunnel-essai-naissance-${ESSAI_NAISSANCE_ENV}
